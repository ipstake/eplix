# Lint checks that need no build and no secrets. scripts/lint.sh runs the
# commit, public-text and format checks locally.
name: lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commits:
    name: commit messages
    # Every commit of the PR, or of the push. A push that starts a branch, or
    # whose old tip is gone after a force push, checks only the new tip.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Conventional Commits, subject length, no AI trailers
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            scripts/check-commits.sh "$PR_BASE..$PR_HEAD"
          elif [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
            scripts/check-commits.sh "$BEFORE..$AFTER"
          else
            scripts/check-commits.sh "$AFTER"
          fi

  public:
    name: public text
    # Home paths, private address ranges and internal note citations across
    # the whole tree. The private name list stays local (CONTRIBUTING.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-public.sh

  workflows:
    name: workflow lint
    # actionlint (with shellcheck for run: blocks) and zizmor, from images
    # pinned by digest, with the repository mounted read-only.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      ZIZMOR: ghcr.io/zizmorcore/zizmor:1.32.0@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm --network none -v "$PWD:/src:ro" -w /src "$ACTIONLINT" -color
      - name: zizmor
        # Online audits (impostor commits, known-vulnerable actions, version
        # comments that do not match the pinned SHA) read public GitHub data
        # with the job's read-only token.
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker run --rm -e GH_TOKEN -v "$PWD:/src:ro" -w /src "$ZIZMOR" --format plain .

  format:
    name: F# format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: .NET SDK (pinned by SHA-512)
        run: .github/scripts/install-dotnet.sh
      - name: Fantomas --check (pinned by SHA-512)
        run: scripts/check-format.sh
